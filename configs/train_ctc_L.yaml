# Stage 1 CTC: 大规模预训练 (WenetSpeech L 集 10000h)
# 纯 CTC loss 训练 encoder + CTC head，不使用 RNN-T loss
# 从当前 stage1_icefall epoch_50 checkpoint 继续训练

inherit: model.yaml

model:
  encoder:
    type: icefall_zipformer2
    encoder_dim: [384, 512]
    downsampling_factor: [2, 4]
    num_encoder_layers: [4, 4]
    num_heads: [8, 8]
    feedforward_dim: [1536, 2048]
    cnn_module_kernel: [31, 31]
    query_head_dim: [24, 24]
    pos_head_dim: [4, 4]
    value_head_dim: [12, 12]
    encoder_unmasked_dim: [256, 256]
    pos_dim: 192
    output_downsampling_factor: 2
    warmup_batches: 4000.0
    dropout: 0.1
    causal: false

  encoder_output_dim: 512

data:
  train_set: wenetspeech_L
  manifest_dir: data/manifests/wenetspeech/train
  tokenizer_path: data/tokenizer/sp_6000.model
  max_duration: 20.0
  min_duration: 0.5
  num_workers: 4
  bucketing_sampler:
    max_duration_per_batch: 1200
    shuffle: true
    drop_last: true

training:
  stage: ctc_L
  num_epochs: 10
  seed: 42
  resume_from: null

  # 从现有 encoder 初始化
  resume_encoder_from: exp/stage1_icefall/epoch_50.pt

  optimizer:
    type: AdamW
    lr: 0.0001
    betas: [0.9, 0.98]
    weight_decay: 0.01
    grad_clip_norm: 1.0
    grad_accum_steps: 4

  scheduler:
    type: cosine
    warmup_steps: 5000
    min_lr_ratio: 0.01

  loss:
    rnnt_weight: 0.0
    ctc_weight: 1.0
    prune_range: 5
    simple_loss_scale: 0.5
    pruned_rnnt:
      simple_loss_scale: 0.5
      lm_scale: 0.25
      am_scale: 0.0

  augmentation:
    spec_augment:
      freq_mask_count: 2
      freq_mask_width: 27
      time_mask_count: 10
      time_mask_width: 50

  checkpoint:
    save_every_n_epochs: 1
    keep_last_n: 3
    exp_dir: exp/ctc_L

  distributed:
    world_size: 1
    backend: nccl
