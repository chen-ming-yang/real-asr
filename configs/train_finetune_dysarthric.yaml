# 构音障碍数据微调 CTC 模型
# 从 exp/finetune_aishell/epoch_20.pt 继续训练
# 训练数据: 78259 utterances (构音障碍语音)

inherit: model.yaml

model:
  encoder:
    type: icefall_zipformer2
    encoder_dim: [384, 512]
    downsampling_factor: [2, 4]
    num_encoder_layers: [4, 4]
    num_heads: [8, 8]
    feedforward_dim: [1536, 2048]
    cnn_module_kernel: [31, 31]
    query_head_dim: [24, 24]
    pos_head_dim: [4, 4]
    value_head_dim: [12, 12]
    encoder_unmasked_dim: [256, 256]
    pos_dim: 192
    output_downsampling_factor: 2
    warmup_batches: 4000.0
    dropout: 0.1
    causal: false

  encoder_output_dim: 512

data:
  train_set: dysarthric_train
  manifest_dir: data/manifests/dysarthric/train
  tokenizer_path: data/tokenizer/sp_6000.model
  max_duration: 30.0
  min_duration: 0.3
  num_workers: 2
  bucketing_sampler:
    max_duration_per_batch: 600
    shuffle: true
    drop_last: true

training:
  stage: finetune_dysarthric
  num_epochs: 30
  seed: 42

  resume_from: exp/finetune_aishell/epoch_20.pt

  optimizer:
    type: AdamW
    lr: 0.00003
    betas: [0.9, 0.98]
    weight_decay: 0.01
    grad_clip_norm: 1.0
    grad_accum_steps: 2

  scheduler:
    type: cosine
    warmup_steps: 1000
    min_lr_ratio: 0.01

  loss:
    rnnt_weight: 0.0
    ctc_weight: 1.0
    prune_range: 5
    simple_loss_scale: 0.5
    pruned_rnnt:
      simple_loss_scale: 0.5
      lm_scale: 0.25
      am_scale: 0.0

  augmentation:
    spec_augment:
      freq_mask_count: 2
      freq_mask_width: 20
      time_mask_count: 3
      time_mask_width: 30

  checkpoint:
    save_every_n_epochs: 1
    keep_last_n: 5
    exp_dir: exp/finetune_dysarthric

  distributed:
    world_size: 1
    backend: nccl
