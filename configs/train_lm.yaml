# Transformer LM 训练配置

model:
  vocab_size: 6000
  d_model: 512
  nhead: 8
  num_layers: 6
  dim_feedforward: 2048
  dropout: 0.1
  max_seq_len: 512

data:
  train_tokens: data/lm_train_tokens.txt
  val_tokens: data/lm_val_tokens.txt
  seq_len: 256
  batch_size: 128
  num_workers: 4

training:
  num_epochs: 10
  seed: 42

  optimizer:
    type: AdamW
    lr: 0.0003
    betas: [0.9, 0.98]
    weight_decay: 0.01

  scheduler:
    warmup_steps: 2000
    min_lr_ratio: 0.01

  grad_clip_norm: 1.0

  checkpoint:
    save_every_n_epochs: 1
    keep_last_n: 3
    exp_dir: exp/transformer_lm
