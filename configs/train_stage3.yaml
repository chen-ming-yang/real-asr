# Stage 3: 有监督微调 (Severity-aware Curriculum Learning)

inherit: model.yaml

data:
  train_set: dysarthric_labeled
  manifest_dir: data/manifests/dysarthric
  max_duration: 30.0
  min_duration: 0.3
  num_workers: 8
  bucketing_sampler:
    max_duration_per_batch: 500
    shuffle: true
    drop_last: true

training:
  stage: finetune
  num_epochs: 20
  seed: 42
  resume_from: exp/stage2_distill/best.pt  # 从 Stage 2 继续

  optimizer:
    type: ScaledAdam
    lr: 0.003  # 微调用更低学习率
    betas: [0.9, 0.98]
    weight_decay: 1.0e-6
    clipping_scale: 2.0

  scheduler:
    type: eden
    warmup_steps: 1000
    lr_batches: 1000

  loss:
    rnnt_weight: 1.0
    ctc_weight: 0.2
    label_smoothing: 0.1
    # 不使用蒸馏 loss，纯有监督

  augmentation:
    spec_augment:
      freq_mask_count: 2
      freq_mask_width: 27
      time_mask_count: 10
      time_mask_width: 100  # 最激进
    speed_perturb:
      factors: [0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3]
    pitch_perturb:
      range_semitones: [-3, 3]
      prob: 0.4
    formant_perturb:
      shift_ratio: 0.1
      prob: 0.3

  # Curriculum Learning: 从易到难
  curriculum:
    enabled: true
    schedule:
      # epoch 1-5: 只用 mild
      - epochs: [1, 5]
        severity_filter: [mild]
      # epoch 6-10: mild + moderate
      - epochs: [6, 10]
        severity_filter: [mild, moderate]
      # epoch 11-15: 全部
      - epochs: [11, 15]
        severity_filter: [mild, moderate, severe]
      # epoch 16-20: 全部，更低学习率
      - epochs: [16, 20]
        severity_filter: [mild, moderate, severe]
        lr_scale: 0.3

  checkpoint:
    save_every_n_epochs: 1
    keep_last_n: 5
    exp_dir: exp/stage3_finetune

  distributed:
    world_size: 4
    backend: nccl
