# RNN-T 从头训练配置（联合 CTC + RNN-T）
# 不依赖任何预训练 checkpoint，全参数从零训练
# 使用 k2 pruned RNN-T loss + CTC 辅助 loss 防止 blank dominance

model:
  encoder:
    type: icefall_zipformer2
    encoder_dim: [384, 512]
    downsampling_factor: [2, 4]
    num_encoder_layers: [4, 4]
    num_heads: [8, 8]
    feedforward_dim: [1536, 2048]
    cnn_module_kernel: [31, 31]
    query_head_dim: [24, 24]
    pos_head_dim: [4, 4]
    value_head_dim: [12, 12]
    encoder_unmasked_dim: [256, 256]
    pos_dim: 192
    output_downsampling_factor: 2
    warmup_batches: 4000.0
    dropout: 0.075
    causal: false

  encoder_output_dim: 512
  vocab_size: 6000
  predictor_dim: 512
  joiner_dim: 512
  context_size: 2

audio:
  sample_rate: 16000
  num_mel_bins: 80

data:
  shard_dir: data/fbank_shards/wenetspeech_ms
  tokenizer_path: data/tokenizer/sp_6000.model
  max_duration_per_batch: 400
  num_workers: 0

loss:
  rnnt_weight: 1.0
  ctc_weight: 0.3
  prune_range: 5
  simple_loss_scale: 0.5

training:
  num_epochs: 30
  lr: 0.0004
  warmup_steps: 5000
  grad_accum_steps: 8
  seed: 42
  exp_dir: exp/rnnt_joint
  keep_last_n: 5
